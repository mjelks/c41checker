inherit_from: .rubocop_todo.yml

# inherit_from: .rubocop_todo.yml # Optional: if you generate a todo list

# Use PascalCase for the department name
AllCops:
  TargetRubyVersion: 3.1
  # Opt in to cops added in newer RuboCop versions instead of getting a pending-cops warning
  NewCops: enable
  # This ensures the samples folder is never touched by the linter
  Exclude:
    - 'samples/**/*'
    - 'vendor/**/*'

# Since your script uses large data hashes for film profiles
Metrics/MethodLength:
  Max: 100
  Exclude:
    - 'legacy-scripts/**/*' # Old scripts kept for reference, not maintained

# High complexity is expected for the ratio calculation logic
Metrics/AbcSize:
  Max: 75

# Allow the long OptionParser block in main
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

# Relaxing string literals since you use both single and double quotes
Style/StringLiterals:
  Enabled: false

# Your script uses some long descriptive lines for console output
Layout/LineLength:
  Max: 130

# Keyword arguments are optional named flags, not positional clutter
Metrics/ParameterLists:
  CountKeywordArgs: false

# test_proimage_100 is the name of a CLI test function (ProImage 100 film stock)
Naming/VariableNumber:
  AllowedIdentifiers:
    - test_proimage_100
